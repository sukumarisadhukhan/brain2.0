<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Identity | Brain 2.0</title>
</head>

<body>

    <h1>Create Identity</h1>

    <form method="POST">

        <label>Name</label>
        <br>

        <input
            type="text"
            name="name"
            placeholder="e.g. Engineer"
            required
        >

        <br><br>


        <label>Icon</label>
        <br>

        <input
            type="text"
            name="icon"
            placeholder="💻"
            maxlength="20"
        >

        <br><br>


        <label>Description</label>
        <br>

        <textarea
            name="description"
            placeholder="What does this identity represent?"
        ></textarea>

        <br><br>

        <button type="submit">
            Create Identity
        </button>

    </form>

    <br>

    <a href="/">
        Back to Brain 2.0
    </a>

</body>

</html>
