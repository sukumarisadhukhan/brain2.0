<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Task | Brain 2.0</title>
</head>

<body>

    <h1>Create Task</h1>

    <form method="POST">

        <!-- TITLE -->

        <label for="title">
            Task
        </label>

        <br>

        <input
            type="text"
            id="title"
            name="title"
            placeholder="What needs to be done?"
            required
        >

        <br><br>


        <!-- DESCRIPTION -->

        <label for="description">
            Description
        </label>

        <br>

        <textarea
            id="description"
            name="description"
            placeholder="Optional details"
        ></textarea>

        <br><br>


        <!-- IDENTITY -->

        <label for="identity_id">
            Identity
        </label>

        <br>

        <select
            id="identity_id"
            name="identity_id"
        >

            <option value="">
                No identity
            </option>

            {% for identity in identities %}

                <option value="{{ identity.id }}">
                    {{ identity.icon or "◉" }}
                    {{ identity.name }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- DEADLINE -->

        <label for="deadline">
            Deadline
        </label>

        <br>

        <input
            type="datetime-local"
            id="deadline"
            name="deadline"
        >

        <br><br>


        <!-- ESTIMATED TIME -->

        <label for="estimated_minutes">
            Estimated time (minutes)
        </label>

        <br>

        <input
            type="number"
            id="estimated_minutes"
            name="estimated_minutes"
            min="1"
            placeholder="e.g. 60"
        >

        <br><br>


        <!-- PRIORITY -->

        <label for="priority">
            Priority
        </label>

        <br>

        <select
            id="priority"
            name="priority"
        >

            <option value="1">
                1 - Critical
            </option>

            <option value="2">
                2 - High
            </option>

            <option value="3" selected>
                3 - Normal
            </option>

            <option value="4">
                4 - Low
            </option>

            <option value="5">
                5 - Minimal
            </option>

        </select>

        <br><br>


        <!-- SUBMIT -->

        <button type="submit">
            Create Task
        </button>

    </form>

    <br>

    <a href="/">
        ← Back to Brain 2.0
    </a>

</body>

</html>
